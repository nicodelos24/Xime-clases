<body>
<div class="app">
  <aside class="demo" aria-label="Aviso de prototipo"><span>DISEÑO · DATOS FICTICIOS</span><button id="abrir-pruebas" aria-expanded="false" aria-controls="pruebas">Pruebas</button></aside>
  <section id="pruebas" class="laboratorio" aria-label="Controles para quien facilita" hidden>
    <h2>Controles de prueba</h2><p>No cambian datos reales. Al recargar se reinicia todo.</p>
    <label for="escenario">Estado de pantalla</label><select id="escenario"><option value="normal">Contenido normal</option><option value="vacio">Vacío / faltante</option><option value="cargando">Cargando</option><option value="error">Error recuperable</option><option value="offline">Sin conexión (simulado)</option></select>
    <div class="acciones"><button id="tema" class="btn s">Usar tema oscuro</button><button id="reiniciar" class="btn s">Reiniciar demo</button></div>
    <p class="ayuda">Fecha fija: 15/11/2026 · Montevideo. Tarifas de ejemplo: mensualidad $ 1.800 UYU, clase $ 250 UYU. No son precios acordados.</p>
  </section>
  <header class="marca"><span class="punto" aria-hidden="true"></span><span>Estudio demo <small>Clases · exploración de diseño</small></span><span class="dueno" aria-label="Cuenta ficticia Dueña A">DA</span></header>
  <main id="contenido" tabindex="-1"></main>
  <nav class="navegacion" aria-label="Principal"></nav>
  <p id="anuncio" class="sr-only" role="status" aria-live="polite"></p>
</div>
<dialog id="dialogo" aria-labelledby="titulo-dialogo"><div id="dialogo-contenido"></div></dialog>
